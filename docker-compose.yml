services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    ports: ["8000:8000"]
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-b:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - VLLM_URL=http://ollama:11434
      - VLLM_URL_B=http://ollama-b:11434
      - PRIMARY_MODEL_ID=${PRIMARY_MODEL_ID:-qwen2.5:1.5b}
      - SECONDARY_MODEL_ID=${SECONDARY_MODEL_ID:-qwen2.5:1.5b}
    restart: unless-stopped
    networks: [gateway-net]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [gateway-net]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [gateway-net]
    # NOTE: no GPU reservation block -- runs on CPU.
    # If you later rent a GPU box, swap this service back to:
    #   image: vllm/vllm-openai:latest
    #   command: --model ... --quantization awq ...
    #   deploy: { resources: { reservations: { devices: [{capabilities: ["gpu"]}] } } }
  ollama-b:
    image: ollama/ollama:latest
    ports: ["11435:11434"]
    volumes:
      - ollama-b-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [gateway-net]
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports: ["9090:9090"]
    networks: [gateway-net]

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboard-files:ro
    networks: [gateway-net]

networks:
  gateway-net:

volumes:
  ollama-data:
  ollama-b-data:
  prom-data:
  grafana-data:
